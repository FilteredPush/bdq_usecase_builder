# BDQ Use Case Builder – Default Configuration
# -----------------------------------------------------------------------
# This file contains the known IRI locations for BDQ vocabularies.
# Copy this file to the directory from which you run the application and
# adjust values as needed.
# -----------------------------------------------------------------------

# IRI of the bdqffdq OWL ontology.
# The ontology defines the conceptual framework (UseCase, Policy,
# DataQualityNeed, Validation, Measure, Amendment, Issue, …).
bdqffdq.ontology.iri=https://raw.githubusercontent.com/tdwg/bdq/master/tg2/_review/vocabulary/bdqffdq.owl

# IRI of the bdqtest RDF file.
# Contains instances of bdqffdq:Validation, bdqffdq:Measure, etc.
bdqtest.rdf.iri=https://raw.githubusercontent.com/tdwg/bdq/master/tg2/_review/vocabulary/bdqtest.ttl

# Comma-separated list of additional RDF IRIs to load at startup (optional).
# These may be remote IRIs or local file:/ paths.
# extra.rdf.iris=

# Base IRI used when auto-generating new use case IRIs.
# The application appends a random UUID to this string.
usecase.base.iri=urn:uuid:
